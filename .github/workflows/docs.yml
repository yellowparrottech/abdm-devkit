name: Docs

# Deploys abdm.yellowparrottech.com when the docs or the packages the walkthrough runs change.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.

on:
  push:
    branches: [main]
    paths: ["docs/**", "packages/**", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'yellowparrottech/abdm-devkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @yellowparrottech/abdm-docs build
      - name: Deploy
        working-directory: docs
        run: pnpm dlx wrangler@4.154.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
